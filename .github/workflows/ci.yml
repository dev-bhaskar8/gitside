name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo package --locked

  distribution:
    name: Distribution checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSfO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz' | sha256sum --check
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          sudo install -m755 actionlint /usr/local/bin/actionlint
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          cargo install cargo-dist --version 0.32.0 --locked
      - name: Validate scripts and package templates
        run: |
          shellcheck scripts/*.sh
          scripts/test-packaging.sh
          SHELLCHECK_OPTS='--exclude=SC2001,SC2086,SC2129' actionlint
      - name: Verify generated release workflow
        run: scripts/check-release-workflow.sh

  nix:
    name: Nix package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41
      - run: nix flake check --print-build-logs
