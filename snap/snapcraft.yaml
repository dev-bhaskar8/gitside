name: gitside
base: core24
version: '0.2.0'
summary: Source control that fits your terminal
title: Gitside
contact: vaas.ygg@gmail.com
description: |
  Gitside is a responsive Git source-control TUI designed for both full
  terminals and narrow tmux side panes. It supports keyboard and mouse
  workflows while inheriting the active terminal palette.
grade: stable
confinement: classic
license: MIT
website: https://dev-bhaskar8.github.io/gitside/
source-code: https://github.com/dev-bhaskar8/gitside
issues: https://github.com/dev-bhaskar8/gitside/issues

platforms:
  amd64:
  arm64:

apps:
  gitside:
    command: bin/gitside

parts:
  gitside:
    plugin: rust
    source: .
    rust-channel: stable
    build-attributes:
      - enable-patchelf
    build-packages:
      - pkg-config
      - libdbus-1-dev
    stage-packages:
      - libdbus-1-3
    override-build: |
      craftctl default
      install -Dm644 LICENSE "$CRAFT_PART_INSTALL/usr/share/licenses/gitside/LICENSE"
      install -Dm644 docs/third-party-notices.md "$CRAFT_PART_INSTALL/usr/share/licenses/gitside/third-party-notices.md"
