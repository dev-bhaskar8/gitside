[package]
name = "gitside"
version = "0.1.0"
edition = "2024"
authors = ["dev-bhaskar8 <vaas.ygg@gmail.com>"]
description = "A VS Code-inspired source control panel for the terminal"
license = "MIT"
rust-version = "1.85"
readme = "README.md"
repository = "https://github.com/dev-bhaskar8/gitside"
homepage = "https://dev-bhaskar8.github.io/gitside/"
documentation = "https://dev-bhaskar8.github.io/gitside/docs/"
keywords = ["git", "terminal", "tui", "source-control", "tmux"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = [
    "src/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[[bin]]
name = "gitside"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "6.0"
futures = "0.3"
notify = "8.2"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
tempfile = "3.16"
tokio = { version = "1.43", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
toml_edit = { version = "0.22", features = ["serde"] }
unicode-width = "0.2"
zeroize = "1.8"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
