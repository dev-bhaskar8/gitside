[package]
name = "sourcepane"
version = "0.1.0"
edition = "2024"
description = "A VS Code-inspired source control panel for the terminal"
license = "MIT"
repository = ""
rust-version = "1.85"

[[bin]]
name = "sourcepane"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "6.0"
futures = "0.3"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
thiserror = "2.0"
tokio = { version = "1.43", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.16"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
