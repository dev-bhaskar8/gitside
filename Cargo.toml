[package]
name = "gitside"
version = "0.1.0"
edition = "2024"
authors = ["dev-bhaskar8 <vaas.ygg@gmail.com>"]
description = "A VS Code-inspired source control panel for the terminal"
license = "MIT"
rust-version = "1.85"
readme = "README.md"
repository = "https://github.com/dev-bhaskar8/gitside"
homepage = "https://dev-bhaskar8.github.io/gitside/"
documentation = "https://dev-bhaskar8.github.io/gitside/docs/"
keywords = ["git", "terminal", "tui", "source-control", "tmux"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = [
    "src/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[package.metadata.wix]
upgrade-guid = "ACD41B7D-CEDB-44F6-9C02-255AB8E92FB6"
path-guid = "F62DD601-1924-42A6-8CA7-E40959C52B22"
license = false
eula = false

[[bin]]
name = "gitside"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "6.0"
futures = "0.3"
notify = "8.2"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
thiserror = "2.0"
tokio = { version = "1.43", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.16"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
