[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "homebrew", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-pc-windows-msvc", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Generate a source archive and dependency SBOM for every release.
source-tarball = true
cargo-cyclonedx = true
# Emit individual and unified SHA-256 checksums.
checksum = "sha256"
# Attach GitHub's OIDC-backed provenance to release artifacts.
github-attestations = true
# Package-manager publications happen only after protected hosting succeeds.
publish-jobs = ["homebrew", "npm", "./publish-crate"]
tap = "dev-bhaskar8/homebrew-tap"
publish-prereleases = false
pr-run-mode = "plan"
# The generated workflow is deterministically patched with protected environments
# and current npm provenance settings by scripts/patch-release-workflow.sh.
allow-dirty = ["ci"]
