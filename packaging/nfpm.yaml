name: gitside
arch: __NFPM_ARCH__
platform: linux
version: __VERSION__
section: devel
priority: optional
maintainer: dev-bhaskar8 <vaas.ygg@gmail.com>
description: A VS Code-inspired source control panel for the terminal
vendor: Gitside
homepage: https://dev-bhaskar8.github.io/gitside/
license: MIT
depends:
  - git
overrides:
  deb:
    depends:
      - git
      - libdbus-1-3
  rpm:
    depends:
      - git
      - dbus-libs
contents:
  - src: __BINARY__
    dst: /usr/bin/gitside
    file_info:
      mode: 0755
  - src: LICENSE
    dst: /usr/share/licenses/gitside/LICENSE
  - src: docs/third-party-notices.md
    dst: /usr/share/licenses/gitside/third-party-notices.md
  - src: README.md
    dst: /usr/share/doc/gitside/README.md
